name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: ops
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U app -d ops"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_URL: postgresql://app:app@localhost:5433/ops

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r ops_etl_demo/requirements.txt

      - name: Init DB
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql "" -f ops_etl_demo/sql/00_init.sql

      - name: Run tests
        run: |
          pytest -q ops_etl_demo/tests
